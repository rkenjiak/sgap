# PLI consumindo um warm start gerado por uma heuristica.
#
# Fluxo:
#   1) sgap-heuristic <gfa> <fastq> config/beam_warmstart.ini results/heur.csv
#      => grava out/sols/<grafo>_<seq>_beam_warmstart.sol
#   2) sgap-solver    <gfa> <fastq> config-pli/pli_warmstart.ini results/pli.csv
#      => le o .sol acima como MIP start, otimiza e sobrescreve com a
#         (provavel) melhor solucao em out/sols/<grafo>_<seq>_pli_warmstart.sol
#
# pli_warm_start_path eh um caminho explicito para deixar a escolha da
# heuristica de origem visivel no config. Substitua o nome dos
# arquivos conforme a instancia que voce vai rodar (formato
# <grafo>_<seq>_<config_name>.sol).

algorithm           = pli
pli_verbose         = true
pli_time_limit_s    = 60

gurobi_sol_dir      = out/sols
pli_warm_start_path = out/sols/100v_a4_d3.0_inst1_100s_a4_inst1_beam_warmstart.sol
