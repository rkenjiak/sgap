# Beam Search produzindo warm start (.sol no formato Gurobi).
# Alem do CSV e do .out (relatorio), grava
#   <gurobi_sol_dir>/<grafo>_<seq>_<config>.sol
# que pode ser apontado em pli_warm_start_path no config-pli.

algorithm       = beam
beam_width      = 1000
beam_potentials = bfs01

# Diretorio compartilhado de .sol (heuristica e PLI usam o mesmo).
gurobi_sol_dir  = out/sols
