# Relaxacao Lagrangeana da restricao de caminho simples.
#
# Dualiza in_v(v) <= 1; o subproblema vira um caminho minimo S->T
# (Dijkstra) e o dual eh maximizado pelo metodo do subgradiente.
# Reporta o limite inferior (lb) e, por reparo primal, um caminho
# simples viavel (ub) no mesmo CSV do sgap-heuristic.
#
# Nao usa Gurobi: roda no sgap-heuristic (sem BUILD_SOLVER).
#
# Uso:
#   sgap-heuristic <gfa> <fastq> config/lagrangian.ini results/lagr.csv

algorithm           = lagrangian
pli_verbose         = true

lagr_max_iters      = 500
lagr_time_limit_s   = 0
lagr_alpha          = 2.0
lagr_alpha_patience = 20

# Largura da beam do reparo primal (guiado por custos reduzidos).
# Usada literalmente: 1 = guloso puro; N = largura fixa da beam.
lagr_repair_beam    = 64

# Opcional: grava o melhor caminho viavel como .sol compativel com o PLI,
# utilizavel como warm start do sgap-solver (pli_warm_start_path).
# gurobi_sol_dir    = out/sols
