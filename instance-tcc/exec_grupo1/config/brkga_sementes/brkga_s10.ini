# GERADO por run_grupo1.ps1 a partir de ../brkga.ini - nao editar
# BRKGA (decoder vertex-priority) - parametros padrao
# brkga_seed eh ignorado: o script gera uma copia deste arquivo por semente
# (-SementesBrkga, padrao 1..10) em brkga_sementes/
